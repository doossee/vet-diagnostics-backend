version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vet-diagnostics-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-vet_diagnostics}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vet-diagnostics-network

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: vet-diagnostics-app-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "${APPLICATION_PORT:-3000}:3000"
    volumes:
      - ./uploads:/app/uploads
    networks:
      - vet-diagnostics-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:

networks:
  vet-diagnostics-network:
    driver: bridge
